name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Check formatting
        run: npm run format:check

      - name: Run Biome checks
        run: npm run check:ci

  test:
    name: Playwright shard ${{ matrix.shard }}/4
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run tests
        env:
          BASE_URL: ${{ vars.BASE_URL || 'https://aitesters.byst.re' }}
          ADMIN_LOGIN_USERNAME: ${{ secrets.ADMIN_LOGIN_USERNAME }}
          ADMIN_LOGIN_PASSWORD: ${{ secrets.ADMIN_LOGIN_PASSWORD }}
        run: |
          : "${BASE_URL:?Set the BASE_URL repository variable.}"
          : "${ADMIN_LOGIN_USERNAME:?Set the ADMIN_LOGIN_USERNAME repository secret.}"
          : "${ADMIN_LOGIN_PASSWORD:?Set the ADMIN_LOGIN_PASSWORD repository secret.}"
          npm test -- --shard=${{ matrix.shard }}/4

      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/*.zip
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 1

  merge-reports:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download shard reports
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: blob-report-*
          path: blob-report
          merge-multiple: true

      - name: Merge reports into HTML
        run: npx playwright merge-reports --reporter=html blob-report

      - name: Upload merged report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
